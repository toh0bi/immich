# Gemeinsamer Reverse Proxy für alle Services auf diesem Server.
# Muss gestartet werden NACHDEM immich und silverbullet laufen,
# da die Netzwerke immich_net und silverbullet_net bereits existieren müssen.

name: proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      # Nur noch an Tailscale-Interface bzw. Tailscale-IP binden, nicht mehr öffentlich 0.0.0.0
      - "${TAILSCALE_IP:-127.0.0.1}:80:80"
      - "${TAILSCALE_IP:-127.0.0.1}:443:443"
      - "${TAILSCALE_IP:-127.0.0.1}:443:443/udp"
      - "${TAILSCALE_IP:-127.0.0.1}:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - immich_net
      - silverbullet_net

networks:
  immich_net:
    external: true
  silverbullet_net:
    external: true

volumes:
  caddy_data:
  caddy_config:
